<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Agent AI Interview Panel</title>
    <meta name="description" content="An advanced multi-agent AI panel for candidate interviews and hiring decisions." />
    <script>
      try {
        let _customFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: () => _customFetch,
          set: (fn) => {
            _customFetch = fn;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
